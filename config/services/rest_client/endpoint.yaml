# ServiceConfig — rest_client_registry endpoint
# Auto-loaded by the unified service registry (recurses
# config/registries/). Companion to service.yaml + hierarchy.yaml.

service:
  name: "rest-client-endpoint"
  entity_type: "EndpointDocument"
  key_type: "str"

  data_source:
    type: "mongodb"
    collection: "endpoints"
    # Endpoint's natural identity is the compound (parent_id, name); for V1
    # the underlying service still keys lookups by Beanie's _id (the
    # hierarchical layer routes through `parent_id` for FK-walking). The
    # graph itself is natural-key-based: parent_id holds service.name.
    key_field: "id"

  cache_backend: "in_memory"
  cache_ttl: 300
  cache_key_prefix: "rest_client_endpoint:"

  cache_strategy: "write_through"
  enable_bulk_operations: true
  enable_cache_warming: true

  max_bulk_size: 1000
  query_timeout_seconds: 30
  # Compound natural-key for upsert-by-natural-key callers.
  upsert_fields: ["parent_id", "name"]

  default_limit: 100
  max_limit: 1000

  enable_event_invalidation: false
  event_service_name: "rest_client_endpoint_cache_events"

controller:
  base_path: "/api/1.0/modelswitch/admin/rest-client-registry/endpoints"
  response_envelope: true

