# ServiceConfig — prompt_registry namespace
# Auto-loaded by the unified service registry (recurses
# config/registries/). Companion to template.yaml, component.yaml +
# hierarchy.yaml.

service:
  name: "prompt-namespace"
  entity_type: "NamespaceDocument"
  key_type: "str"

  data_source:
    type: "mongodb"
    collection: "namespaces"
    # Natural-key lookups via `namespace` field.
    key_field: "namespace"

  cache_backend: "in_memory"
  cache_ttl: 300
  cache_key_prefix: "prompt_namespace:"

  cache_strategy: "write_through"
  enable_bulk_operations: true
  enable_cache_warming: true

  max_bulk_size: 1000
  query_timeout_seconds: 30
  upsert_fields: ["namespace"]

  default_limit: 100
  max_limit: 1000

  enable_event_invalidation: false
  event_service_name: "prompt_namespace_cache_events"

controller:
  base_path: "/api/1.0/modelswitch/admin/prompt-registry/namespaces"
  response_envelope: true

