services:
  # Unified Data Service
  unified-data-service:
    image: ${UDS_IMAGE:-unified-data-service:local}
    build: .
    ports:
      - "8080:8080"
    env_file:
      - ../env/local/unified-data-service.properties
    environment:
      - UDS_DATABASE__MONGODB_URI=mongodb://admin:password@mongodb:27017
      - UDS_DATABASE__MONGODB_DATABASE=unified_data_service
      - UDS_CACHE__REDIS_HOST=redis
      - UDS_CACHE__REDIS_PORT=6379
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    networks:
      - shared-infrastructure

networks:
  shared-infrastructure:
    external: true
